# mammoth-console 伴生交付：静态控制台 + 反代到 mammoth 引擎
#
# 场景 A（推荐）：引擎已在同一 docker 网络运行（服务名 mammoth）
#   docker compose -f deploy/compose.yaml up -d --build
#
# 场景 B：引擎跑在宿主机
#   MAMMOTH_UPSTREAM=http://host.docker.internal:8080 \
#     docker compose -f deploy/compose.yaml up -d --build
#
# 打开 http://<host>:8081 ，在连接页填引擎 token、地址留空即可。
services:
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # 控制台内所有 /api 请求由 Caddy 反代到这里
      MAMMOTH_UPSTREAM: ${MAMMOTH_UPSTREAM:-http://mammoth:8080}
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

