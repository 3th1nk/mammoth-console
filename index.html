<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 防暗色首屏闪烁：挂载前先落 class（与 stores/theme.ts 同一持久化键）
      try {
        var t = localStorage.getItem('mammoth.console.theme')
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/mammoth.svg" />
    <title>Mammoth Console</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
